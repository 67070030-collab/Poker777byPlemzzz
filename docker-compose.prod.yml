# Poker777 — all-in-one deploy for a single EC2 (AWS Learner Lab, "ท่าที่ 1").
#
# Runs the whole stack in Docker on ONE instance: frontend + backend + MySQL +
# Redis. Enough to prove the game works on the cloud before splitting MySQL out
# to RDS (the real ท่าที่ 1). Bring it up with:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Then open http://<EC2_PUBLIC_IP>:3000  (security group must allow 3000 + 4000).
#
# SECURITY: change JWT_SECRET and INTERNAL_API_KEY below before any real use.

services:
  mysql:
    image: mysql:8.0
    container_name: poker777-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: poker777
      MYSQL_USER: poker
      MYSQL_PASSWORD: pokerpass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: poker777-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: poker777-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # NODE_ENV is left as development on purpose: the app then allows any
      # http(s) Origin, so we don't need to know the EC2 public IP for CORS.
      # Tighten this (NODE_ENV=production + CORS_ALLOWED_ORIGINS) once you have
      # a fixed domain/IP.
      PORT: "4000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: poker
      DB_PASSWORD: pokerpass
      DB_NAME: poker777
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_KEY_PREFIX: "poker:"
      JWT_SECRET: "poker777-prod-change-me-to-a-long-random-32char-secret"
      JWT_EXPIRES_IN: "24h"
      JWT_ISSUER: "poker777"
      INTERNAL_API_KEY: "poker777-internal-change-me"
    # Apply the DB schema, then start the API. MySQL is already healthy here.
    command: sh -c "node src/scripts/migrate.js && node src/server.js"
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: poker777-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
